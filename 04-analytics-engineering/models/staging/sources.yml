version: 2

sources:
  - name: raw_data
    description: Raw data sources for NYC taxi rides
    database: tactile-anthem-485519-v6 # Product ID
    schema: nytaxi # Dataset name
    tables:
      - name: green_tripdata
        description: "Raw green taxi trip data"
        columns:
          - name: vendorid
            description: |
              A code indicating the provider associated with the trip record.
                1: 'Creative Mobile Technologies'
                2: 'VeriFone Inc.'
                4: 'Unknown/Other'
            data_type: integer
            config: 
              meta:
                pii: false
                ownership: data_team
                importance: high
                formatting: none
      - name: yellow_tripdata